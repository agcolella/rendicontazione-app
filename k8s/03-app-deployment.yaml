apiVersion: v1
kind: Namespace
metadata:
  name: app-rendicontazione
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rendicontazione-app
  namespace: app-rendicontazione
  labels:
    app: rendicontazione-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rendicontazione-app
  template:
    metadata:
      labels:
        app: rendicontazione-app
    spec:
      containers:
        - name: rendicontazione-app
          image: ghcr.io/agcolella/rendicontazione-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: rendicontazione-service
  namespace: app-rendicontazione
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: rendicontazione-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rendicontazione-ingress
  namespace: app-rendicontazione
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: rendicontazione.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rendicontazione-service
                port:
                  number: 80
