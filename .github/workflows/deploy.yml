name: Build and Deploy to K3s

on:
  push:
    branches:
      - main # Si attiva ad ogni push sul ramo main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/rendicontazione-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del codice dal repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurazione QEMU per la compilazione ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Configurazione Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticazione su GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build e Push dell'immagine ARM64
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Configurazione Kubeconfig per kubectl
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.Kubeconfig_K3s }}

      # 7. Rollout ed aggiornamento sul cluster K3s
      - name: Deploy to K3s Cluster
        run: |
          kubectl apply -f deploy-rendicontazione.yaml
          kubectl rollout restart deployment/rendicontazione-app -n apps
          kubectl rollout status deployment/rendicontazione-app -n apps --timeout=90s
