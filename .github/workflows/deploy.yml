name: Build and Deploy to K3s

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/rendicontazione-app

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4

# 2. VERIFICA SINTATTICA HTML (Senza dipendenza da npx)
      - name: Validate HTML Structure
        run: |
          echo "🔍 Avvio verifica statica dell'applicazione..."
          
          # Individua il file HTML
          HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
          
          if [ -z "$HTML_FILE" ]; then
            echo "❌ Errore: Nessun file HTML trovato nella root del repository!"
            exit 1
          fi

          echo "📄 File analizzato: $HTML_FILE"

          # Controllo presenza tag di chiusura fondamentali
          if ! grep -i -q "</html>" "$HTML_FILE"; then
            echo "❌ Errore: Il file $HTML_FILE non sembra essere un documento HTML valido (manca </html>)!"
            exit 1
          fi

          echo "✅ Struttura HTML di base corretta!"

      # 3. VERIFICA MANIFEST KUBERNETES (In pure-shell o via Docker)
      - name: Validate Kubernetes Manifests
        run: |
          echo "🔍 Validazione del file deploy-rendicontazione.yaml..."
          
          if [ ! -f deploy-rendicontazione.yaml ]; then
            echo "❌ Errore: Manifest deploy-rendicontazione.yaml non trovato!"
            exit 1
          fi

          # Controllo presenza campi obbligatori nel manifest YAML
          grep -q "kind: Deployment" deploy-rendicontazione.yaml
          grep -q "kind: Service" deploy-rendicontazione.yaml
          
          echo "✅ Manifest YAML presente e strutturato correttamente!"
      # 4. Autenticazione su GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build e Push dell'immagine Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Deploy e Rollout su K3s
      - name: Deploy to K3s Cluster
        run: |
          kubectl apply -f deploy-rendicontazione.yaml
          kubectl rollout restart deployment/rendicontazione-app -n apps
          kubectl rollout status deployment/rendicontazione-app -n apps --timeout=90s
