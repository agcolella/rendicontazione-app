name: Build and Deploy Rendicontazione App

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/rendicontazione-app

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Autenticazione su GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Configurazione Buildx per build veloci con cache su x86_64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build e Push dell'immagine Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Deploy e Rollout su K3s (Zorin OS)
      - name: Deploy to K3s Cluster
        run: |
          echo "🚀 Applicazione dei manifest Kubernetes per rendicontazione-app..."
          kubectl apply -f k8s/03-app-deployment.yaml

          echo "🔄 Esecuzione rollout del deployment..."
          kubectl rollout restart deployment/rendicontazione-app -n app-rendicontazione

          echo "📊 Stato dei Pod attivi nel namespace app-rendicontazione:"
          kubectl get pods -n app-rendicontazione -o wide
