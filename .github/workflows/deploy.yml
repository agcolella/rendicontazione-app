name: Build and Deploy to K3s

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/rendicontazione-app

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 8 # Evita blocchi infiniti del runner in caso di saturazione risorse

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. VERIFICA SINTATTICA HTML
      - name: Validate HTML Structure
        run: |
          echo "🔍 Avvio verifica statica dell'applicazione..."
          HTML_FILE=$(ls *.html 2>/dev/null | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "❌ Errore: Nessun file HTML trovato nella root del repository!"
            exit 1
          fi
          if ! grep -i -q "</html>" "$HTML_FILE"; then
            echo "❌ Errore: Il file $HTML_FILE non è un documento HTML valido!"
            exit 1
          fi
          echo "✅ Struttura HTML corretta!"

      # 3. VERIFICA MANIFEST KUBERNETES
      - name: Validate Kubernetes Manifests
        run: |
          echo "🔍 Validazione dei manifest nella cartella k8s/..."
          if [ ! -d k8s ]; then
            echo "❌ Errore: Cartella k8s/ non trovata!"
            exit 1
          fi
          for file in k8s/*.yaml; do
            if ! grep -q -E "kind: (Deployment|Service|IPAddressPool|L2Advertisement)" "$file"; then
              echo "❌ Errore: $file non contiene una risorsa Kubernetes valida!"
              exit 1
            fi
          done
          echo "✅ Manifest YAML validi!"


# 4. Autenticazione su GHCR
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 5. Build e Push nativo (senza overhead di buildx)
      - name: Build and push Docker image
        run: |
          echo "🔨 Build dell'immagine Docker in corso..."
          docker build -t ghcr.io/agcolella/rendicontazione-app:latest -t ghcr.io/agcolella/rendicontazione-app:${{ github.sha }} .
          
          echo "🚀 Push su GHCR..."
          docker push ghcr.io/agcolella/rendicontazione-app:latest
          docker push ghcr.io/agcolella/rendicontazione-app:${{ github.sha }}



      # 4. Autenticazione su GHCR
#      - name: Log in to GHCR
#        uses: docker/login-action@v3
#        with:
#          registry: ${{ env.REGISTRY }}
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
#
#      # 5. Build e Push Docker alleggerito con cache locale
#      - name: Build and push Docker image
#        uses: docker/build-push-action@v5
#        with:
#          context: .
#          push: true
#          tags: |
#            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
#            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Abilita il riutilizzo della cache locale sul Raspberry Pi per velocizzare le build successive
#          cache-from: type=gha
#          cache-to: type=gha,mode=max

      # 6. Deploy e Rollout graduale su K3s
      - name: Deploy to K3s Cluster
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/rendicontazione-app -n apps
          kubectl rollout status deployment/rendicontazione-app -n apps --timeout=120s
