name: Build and Deploy to K3s

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agcolella/rendicontazione-app

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. VERIFICA 1: Linting HTML
      - name: Validate HTML Structure & Syntax
        run: |
          echo "🔍 Avvio verifica statica dell'applicazione..."
          if [ ! -f index.html ] && [ ! -f rendicontazione_giorni_s_ed_f.html ]; then
            echo "❌ Errore: File HTML dell'applicazione non trovato!"
            exit 1
          fi
          npx --yes htmlhint "*.html" --rules "tagname-lowercase,attr-lowercase,spec-char-escape,id-unique"
          echo "✅ HTML valido!"

      # 3. VERIFICA 2: Validazione Manifest Kubernetes
      - name: Validate Kubernetes Manifests
        run: |
          echo "🔍 Validazione del file deploy-rendicontazione.yaml..."
          npx --yes kubeconform \
            -strict \
            -summary \
            deploy-rendicontazione.yaml
          echo "✅ Manifest YAML valido e conforme alle API Kubernetes!"

      # 4. Autenticazione su GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build e Push dell'immagine Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Deploy e Rollout su K3s
      - name: Deploy to K3s Cluster
        run: |
          kubectl apply -f deploy-rendicontazione.yaml
          kubectl rollout restart deployment/rendicontazione-app -n apps
          kubectl rollout status deployment/rendicontazione-app -n apps --timeout=90s
